[project]
name = "aarogya-vayu-2036"
version = "0.1.0"
description = "Moves medicine between rural clinics before heat or smog empties their shelves (BUILD 2036 entry)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.52.4",
]


[project.scripts]
aarogya-vayu = "aarogya_vayu:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
